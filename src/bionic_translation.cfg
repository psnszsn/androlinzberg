# Android sonames provided by the bionic compatibility libraries in ARTZIG_ROOT/lib64.
# The Zig build installs unversioned filenames, so these mappings intentionally
# differ from bionic_translation's distro-oriented *.so.0 defaults.
libc.so             libc_bio.so
libm.so             libm.so.6
libz.so             libz.so.1
libstdc++.so        libstdc++_bio.so
libEGL.so           libazk_egl.so
libGLESv2.so        libGLESv2.so.2
libGLESv3.so        libGLESv2.so.2
libvulkan.so        libvulkan.so.1
# Native binder: the hosted libbinder_ndk.so (Zig, over the AZKB protocol)
# provides the NDK binder C ABI; installed unversioned in lib/art.
libbinder_ndk.so    libbinder_ndk.so
libbinder.so        libbinder.so
# Original NDK codecs and formats share the already-loaded platform island.
# Native MediaCodec reaches the Codec2 service through Binder.
libmediandk.so      libandroid_platform.so
# Stock libaaudio in the native island over the stock AudioTrack client.
libaaudio.so        libandroid_platform.so
# Stock public NDK wrappers in the native island.
libandroid.so      libandroid_platform.so
libstatssocket.so  libandroid_platform.so
libjnigraphics.so  libandroid_platform.so
liblog.so          libandroid_platform.so
